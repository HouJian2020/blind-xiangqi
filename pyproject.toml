[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xiangqi-engine"
version = "0.1.0"
description = "Chinese Chess (Xiangqi) engine with UCI protocol support"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "chess>=1.10",
    "xiangqi-setup>=1.0",
    "cchess>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
blind-xiangqi = "xiangqi_engine.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["xiangqi_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"